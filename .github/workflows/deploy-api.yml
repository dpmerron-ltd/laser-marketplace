name: Deploy Laser Marketplace API
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: laser-marketplace-api
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Check deployment credentials
        id: credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::API deployment skipped. Deploy locally after supabase login, or configure SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF for this fork."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.credentials.outputs.configured == 'true'
      - run: npm run build:api
        if: steps.credentials.outputs.configured == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.configured == 'true'
        with:
          version: latest
      - run: supabase functions deploy cnc-api --project-ref "$SUPABASE_PROJECT_REF" --use-api
        if: steps.credentials.outputs.configured == 'true'
